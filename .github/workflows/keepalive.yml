name: Keep Alive Render Bot

on:
  schedule:
    # 每 10 分鐘 ping 一次，防止 Render 免費層 15 分鐘休眠
    - cron: '*/10 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          URL="${{ secrets.RENDER_BOT_URL }}"
          if [ -z "$URL" ]; then
            URL="https://ph-pay-bot-febv.onrender.com"
          fi
          echo "Pinging $URL..."
          curl -s -f -m 30 "$URL" || echo "Ping request sent (waking up or waiting)"
